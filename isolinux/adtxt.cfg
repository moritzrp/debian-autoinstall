label expert
	menu label E^xpert install
	kernel /install.amd/vmlinuz
	append priority=low vga=788 initrd=/install.amd/initrd.gz --- 
include rqtxt.cfg
label auto
	menu label ^Automated install
	kernel /install.amd/vmlinuz
	append auto=true priority=critical vga=788 initrd=/install.amd/initrd.gz --- quiet 
# timeout to install
timeout 50
ontimeout /install.amd/vmlinuz auto=true priority=critical vga=788 initrd=/install.amd/initrd.gz --- quiet 
menu autoboot Press a key, otherwise automated installation will be started in # second{,s}...
